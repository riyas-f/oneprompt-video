services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oneprompt
      POSTGRES_PASSWORD: oneprompt
      POSTGRES_DB: oneprompt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
